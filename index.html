<!DOCTYPE html>
<html lang="zh-Hant" data-theme="clean" data-style="modern">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.basemaps.cartocdn.com https://upload.wikimedia.org https://places.googleapis.com https://*.googleusercontent.com; connect-src 'self' https://routing.openstreetmap.de https://nominatim.openstreetmap.org https://*.googleapis.com https://tile.openstreetmap.org https://*.basemaps.cartocdn.com https://api.open-meteo.com https://overpass-api.de https://*.wikipedia.org https://tiles.openfreemap.org; frame-src https://*.firebaseapp.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅遊地圖 Trip Map</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="description" content="出國旅遊行程地圖：距離、交通方式、Google 地點匯入、自動排行程">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅遊地圖">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="topbar">
  <img id="logo" src="icons/icon.svg" alt="">
  <select id="tripSelect" aria-label="選擇旅程"></select>
  <span id="syncBadge" class="badge" hidden></span>
  <button id="btnShare" class="icon-btn" title="分享與備份"><i data-ic="share"></i></button>
  <button id="btnSettings" class="icon-btn" title="設定"><i data-ic="settings"></i></button>
</header>

<div id="map" aria-label="地圖"></div>
<div id="mapTools">
  <button id="btnLocate" class="fab" title="我的位置"><i data-ic="locate"></i></button>
  <button id="btnFit" class="fab" title="顯示全部"><i data-ic="fit"></i></button>
</div>
<div id="pickHint" hidden></div>

<section id="panel" class="half">
  <button id="sheetHandle" aria-label="展開/收合"><span></span></button>
  <nav id="tabs">
    <button data-tab="plan" class="on"><i data-ic="plan"></i>行程</button>
    <button data-tab="places"><i data-ic="places"></i>地點</button>
    <button data-tab="add"><i data-ic="add"></i>新增</button>
    <button data-tab="measure"><i data-ic="measure"></i>量距離</button>
    <button data-tab="list"><i data-ic="list"></i>清單</button>
  </nav>
  <div id="tabBody"></div>
</section>

<div id="modal" hidden><div class="modal-card" role="dialog"><div id="modalBody"></div></div></div>
<div id="toast" hidden></div>
<input type="file" id="ticketInput" accept=".pdf,application/pdf,image/*" hidden>
<input type="file" id="fileInput" accept=".csv,.json,.geojson,.kml,text/csv,application/json,application/vnd.google-earth.kml+xml" multiple hidden>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/icons.js"></script>
<script src="js/core.js"></script>
<script src="js/services.js"></script>
<script src="js/sync.js"></script>
<script src="js/mapstyle.js"></script>
<script src="js/ticket.js"></script>
<script src="js/app.js"></script>
</body>
</html>
