<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅遊地圖 Trip Map</title>
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅遊地圖">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="topbar">
  <select id="tripSelect" aria-label="選擇旅程"></select>
  <span id="syncBadge" class="badge" hidden></span>
  <button id="btnShare" class="icon-btn" title="分享">📤</button>
  <button id="btnSettings" class="icon-btn" title="設定">⚙️</button>
</header>

<div id="map" aria-label="地圖"></div>
<div id="mapTools">
  <button id="btnLocate" class="fab" title="我的位置">◎</button>
  <button id="btnFit" class="fab" title="顯示全部">⤢</button>
</div>
<div id="pickHint" hidden></div>

<section id="panel" class="half">
  <button id="sheetHandle" aria-label="展開/收合"><span></span></button>
  <nav id="tabs">
    <button data-tab="plan" class="on">🗓️ 行程</button>
    <button data-tab="places">📍 地點</button>
    <button data-tab="add">➕ 新增</button>
    <button data-tab="measure">📏 量距離</button>
  </nav>
  <div id="tabBody"></div>
</section>

<div id="modal" hidden><div class="modal-card" role="dialog"><div id="modalBody"></div></div></div>
<div id="toast" hidden></div>
<input type="file" id="fileInput" accept=".csv,.json,.geojson,.kml,text/csv,application/json,application/vnd.google-earth.kml+xml" multiple hidden>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/core.js"></script>
<script src="js/services.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
